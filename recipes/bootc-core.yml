# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: script
    scripts:
      - install-apps.sh

  - type: script
    snippets:
      - "dnf config-manager --set-enabled crb"

  - type: dnf
    install:
      packages:
        - epel-release

  - type: script
    snippets:
      - "dnf install --nogpgcheck --repofrompath 'terra,https://repos.fyralabs.com/terrael$releasever' terra-release -y"

  - type: dnf
    repos:
      cleanup: true
      copr:
        - name: ligenix/enterprise-cosmic
          chroot: rhel+epel-10-x86_64
      files:
        - https://pkg.cloudflareclient.com/cloudflare-warp-ascii.repo
    install:
      packages:
        - cosmic-desktop
        - cosmic-ext-calculator
        - cosmic-ext-storage
        - cosmic-ext-applet-clipboard-manager
        - cosmic-ext-noctua
        - cosmic-ext-applet-sysinfo
        - cosmic-ext-applet-logomenu
        - cosmic-ext-xcalendar
        - cosmic-ext-tasks
        - cosmic-ext-camera
        - inputplumber
        - NetworkManager-openvpn-gnome
        - fresh
        - fish
        - lazygit
        - helix
        - neovim
        - python3-neovim
        - zellij
        - topgrade
        - google-noto-sans-myanmar-fonts
        - google-noto-serif-myanmar-fonts
        - bibata-cursor-theme
        - cloudflare-warp
        - lolcat
        - figlet
        - cowsay
        - btop
        - fastfetch
        - podman-compose
        - aria2
        - bat
        - ripgrep
        - yazi
        - starship
        - stress-ng
        - byobu
        - micro
        - steam-devices
        - ShellCheck
        - lm_sensors
        - surge
    remove:
      auto-remove: true
      packages:
        - toolbox

  - type: systemd
    system:
      masked:
        - flatpak-add-fedora-repos.service
        - bootc-fetch-apply-updates.timer
    user:
      enabled:
        - podman.socket

  - type: fonts
    fonts:
      url-fonts:
        - name: NotoColorEmoji
          url: https://github.com/googlefonts/noto-emoji/raw/main/fonts/NotoColorEmoji.ttf
        - name: Maple-Mono-NF
          url: https://github.com/subframe7536/maple-font/releases/latest/download/MapleMono-NF-unhinted.zip

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: user
        repo:
          name: flathub
          title: Flathub
      - notify: false
        scope: user
        repo:
          name: cosmic
          title: COSMIC
          url: https://apt.pop-os.org/cosmic/cosmic.flatpakrepo

  - type: script
    scripts:
      - adios-ioscheduler.sh
      - install-theme.sh
      - cleanup.sh
