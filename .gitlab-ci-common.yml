# --- Reusable Setup Logic ---
.setup_env: &setup_env
  - echo "Waiting for Docker daemon..."
  - until docker info > /dev/null 2>&1; do sleep 1; done
  - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
  - export COSIGN_PRIVATE_KEY=$(cat .secure_files/cosign.key)
  - echo "Logging in to $CI_REGISTRY..."
  - echo $CI_REGISTRY_PASSWORD | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin

# --- Reusable crane install steps ---
# Use !reference [.install-crane, script] to include these steps in a job's script.
# Note: YAML anchors (&/*) cannot cross file boundaries — !reference must be used instead.
.install-crane:
  script:
    - curl -fsSL -o /tmp/crane.tgz https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz
    - tar -xzf /tmp/crane.tgz -C /tmp crane
    - install -m 0755 /tmp/crane /usr/local/bin/crane

.bluebuild-job-template:
  interruptible: true
  tags:
    - saas-linux-2xlarge-amd64
  image:
    name: ghcr.io/blue-build/cli
    entrypoint: [""]
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: $DOCKER_TLS_CERTDIR/client
    S3_ENDPOINT_URL: "https://eu-1.cdn77-storage.com"
  before_script:
    - *setup_env

# --- Reusable ISO build/upload/purge job ---
# Concrete jobs need only provide:
#   variables:
#     ISO_NAME: "my-image-x86_64.iso"
#     IMAGE_NAME: "registry.gitlab.com/origami-linux/images/my-image"
.iso-job-template:
  extends: .bluebuild-job-template
  stage: iso
  before_script:
    - !reference [.bluebuild-job-template, before_script]
    - echo "Installing AWS CLI..."
    - dnf install -y awscli2
  script:
    # Build ISO
    - bluebuild generate-iso --secure-boot-url https://gitlab.com/origami-linux/images/-/raw/main/MOK.der --enrollment-password origami --iso-name $ISO_NAME image $IMAGE_NAME

    # Generate SHA256
    - sha256sum $ISO_NAME | tee $ISO_NAME.sha256

    # Print SHA256 in logs
    - echo "================ ISO SHA256 ================"
    - cat $ISO_NAME.sha256
    - echo "============================================"

    # Upload Daily ISO + checksum
    - export AWS_ACCESS_KEY_ID=$S3_ACCESS_KEY
    - export AWS_SECRET_ACCESS_KEY=$S3_SECRET_KEY
    - aws s3 cp $ISO_NAME s3://origami-linux/$ISO_NAME --endpoint-url $S3_ENDPOINT_URL
    - aws s3 cp $ISO_NAME.sha256 s3://origami-linux/$ISO_NAME.sha256 --endpoint-url $S3_ENDPOINT_URL

    # --- NEW: Map Git Tag to Release Version ---
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Pipeline triggered by Git tag: $CI_COMMIT_TAG"
        # Strip the leading 'v' if you use tags like v2026.03
        export RELEASE_VERSION="${CI_COMMIT_TAG#v}"
      fi

    # --- NEW: Monthly Snapshot Logic ---
    - |
      if [ -n "$RELEASE_VERSION" ]; then
        echo "RELEASE_VERSION is set to $RELEASE_VERSION. Creating static snapshot..."

        # Strip the .iso extension and append the version (e.g., origami-x86_64-2026.03.iso)
        SNAPSHOT_ISO="${ISO_NAME%.iso}-${RELEASE_VERSION}.iso"

        # Copy the daily files to the new snapshot names
        cp $ISO_NAME $SNAPSHOT_ISO
        cp $ISO_NAME.sha256 $SNAPSHOT_ISO.sha256

        # Upload the snapshot ISO + checksum to S3
        aws s3 cp $SNAPSHOT_ISO s3://origami-linux/$SNAPSHOT_ISO --endpoint-url $S3_ENDPOINT_URL
        aws s3 cp $SNAPSHOT_ISO.sha256 s3://origami-linux/$SNAPSHOT_ISO.sha256 --endpoint-url $S3_ENDPOINT_URL

        echo "Snapshot $SNAPSHOT_ISO successfully uploaded to S3!"
      else
        echo "No tag detected. Skipping snapshot upload. This is a standard daily build."
      fi

    # Purge CDN for the Daily ISO (ISO + checksum)
    - |
      curl -X POST "https://api.cdn77.com/v3/cdn/$CDN_ID/job/purge/paths" \
        -H "Authorization: Bearer $CDN77_API_KEY" \
        -H "Content-Type: application/json" \
        -d "{\"paths\": [\"/$ISO_NAME\", \"/$ISO_NAME.sha256\"]}"
  artifacts:
    name: "origami-iso-checksums-$CI_COMMIT_SHA"
    when: always
    expire_in: 2 years
    paths:
      - $ISO_NAME.sha256
      - "*.sha256" # Captures both the daily and snapshot checksums if they exist
